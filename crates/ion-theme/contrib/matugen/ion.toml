# matugen template for Ion's palette file (used by the "dms" theme source).
# DMS / matugen render it to ~/.config/ion/dms-palette.toml; Ion watches that
# file and re-themes live. See crates/ion-theme/README.md for the setup.

[colors]
background = "{{colors.surface_container_lowest.default.hex}}"
surface = "{{colors.surface_container.default.hex}}"
surface_raised = "{{colors.surface_container_high.default.hex}}"
surface_hover = "{{colors.surface_container_highest.default.hex}}"
border = "{{colors.outline_variant.default.hex}}"
text = "{{colors.on_surface.default.hex}}"
text_muted = "{{colors.on_surface_variant.default.hex}}"
accent = "{{colors.primary.default.hex}}"
on_accent = "{{colors.on_primary.default.hex}}"
danger = "{{colors.error.default.hex}}"
