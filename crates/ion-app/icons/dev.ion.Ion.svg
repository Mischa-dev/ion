<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Ion</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a37"/>
      <stop offset="1" stop-color="#16161d"/>
    </linearGradient>
    <linearGradient id="charge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb4ca"/>
      <stop offset="0.5" stop-color="#7e9cd8"/>
      <stop offset="1" stop-color="#957fb8"/>
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
  <!-- Orbit, open at the top right where the electron sits. -->
